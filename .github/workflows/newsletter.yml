name: Newsletter versenden

on:
  push:
    branches: [main]
    paths: ["newsletter/outbox/**"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: newsletter
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Versand-Ausgang verschicken
        env:
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          BREVO_LIST_ID: ${{ vars.BREVO_LIST_ID }}
          BREVO_ALERT_SEGMENT_ID: ${{ vars.BREVO_ALERT_SEGMENT_ID }}
          SENDER_EMAIL: ${{ vars.SENDER_EMAIL }}
          SENDER_NAME: ${{ vars.SENDER_NAME }}
        run: python send_newsletter.py
      - name: Versandstatus speichern
        run: |
          if [ -n "$(git status --porcelain newsletter)" ]; then
            git config user.name "HR Radar Versand"
            git config user.email "HRSwitzerland@users.noreply.github.com"
            git add newsletter
            git commit -m "Newsletter versendet"
            git pull --rebase origin main
            git push
          fi
